name: API and frontend CI

on:
  push:
    branches: ["10月後半"]
  pull_request:
    branches: ["10月後半"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend unit, component, and screen tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests (npm test)
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser screen-operation tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  api-tests:
    name: .NET API build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API dependencies
        run: dotnet restore EmployeeApi1/EmployeeApi.slnx

      - name: Build API
        run: dotnet build EmployeeApi1/EmployeeApi.slnx --configuration Release --no-restore

      - name: Test API with coverage
        run: dotnet test EmployeeApi1/EmployeeApi.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory EmployeeApi1/TestResults

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: EmployeeApi1/TestResults/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [frontend-tests, api-tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        working-directory: EmployeeApi1
        run: docker compose config --quiet
        env:
          MSSQL_SA_PASSWORD: Ci_Passw0rd!2026
          JWT_KEY: ci-only-signing-key-0123456789abcdef0123456789abcdef
          SEED_ADMIN_USERNAME: ci-admin
          SEED_ADMIN_PASSWORD: CiOnlyPassword123!

      - name: Build API Docker image
        run: docker build -f EmployeeApi1/Dockerfile -t employee-api:ci EmployeeApi1
