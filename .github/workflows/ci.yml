name: API and frontend CI

on:
  push:
    branches: ["10月後半"]
  pull_request:
    branches: ["10月後半"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend unit, component, and screen tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests (npm test)
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser screen-operation tests
        run: npm run test:e2e

      - name: Start production preview for Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/vite-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Run Lighthouse accessibility audit (mobile)
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4174/ \
            --only-categories=accessibility \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=/tmp/lighthouse-accessibility.json \
            --quiet
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/lighthouse-accessibility.json', 'utf8'));
          const category = report.categories.accessibility;
          const score = category.score ?? 0;
          console.log(`Lighthouse accessibility score: ${Math.round(score * 100)}/100`);
          const failed = Object.values(report.audits)
            .filter((audit) => audit.score === 0 && audit.details?.type !== 'debugdata')
            .map((audit) => ({ id: audit.id, title: audit.title, description: audit.description }));
          if (failed.length) {
            console.log('Failed accessibility audits:', JSON.stringify(failed, null, 2));
          }
          if (score < 0.95) process.exit(1);
          NODE

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  api-tests:
    name: .NET API build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API dependencies
        run: dotnet restore EmployeeApi1/EmployeeApi.slnx

      - name: Build API
        run: dotnet build EmployeeApi1/EmployeeApi.slnx --configuration Release --no-restore

      - name: Test API with coverage
        run: dotnet test EmployeeApi1/EmployeeApi.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory EmployeeApi1/TestResults

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: EmployeeApi1/TestResults/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [frontend-tests, api-tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        working-directory: EmployeeApi1
        run: docker compose config --quiet
        env:
          MSSQL_SA_PASSWORD: Ci_Passw0rd!2026
          JWT_KEY: ci-only-signing-key-0123456789abcdef0123456789abcdef
          SEED_ADMIN_USERNAME: ci-admin
          SEED_ADMIN_PASSWORD: CiOnlyPassword123!

      - name: Build API Docker image
        run: docker build -f EmployeeApi1/Dockerfile -t employee-api:ci EmployeeApi1
