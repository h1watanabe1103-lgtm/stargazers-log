name: Package EmployeeApi1 ZIP

on:
  push:
    branches: ["10月後半"]
    paths:
      - "EmployeeApi1/**"
      - ".github/workflows/package-employeeapi.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Create sanitized EmployeeApi1.zip
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build clean archive
        shell: bash
        run: |
          set -euo pipefail

          # Remove local-only configuration and generated results before packaging.
          find EmployeeApi1 -type f \( \
            -name '.env' -o \
            \( -name '.env.*' ! -name '.env.example' \) -o \
            -name 'appsettings.Development.json' -o \
            -name 'appsettings.*.local.json' -o \
            -name 'compose.yaml.old' -o \
            -name '*.pfx' -o \
            -name '*.key' \
          \) -delete

          find EmployeeApi1 -type d \( \
            -name '.git' -o \
            -name '.vscode' -o \
            -name '.claude' -o \
            -name 'node_modules' -o \
            -name 'bin' -o \
            -name 'obj' -o \
            -name 'TestResults' -o \
            -name 'test-results' -o \
            -name 'playwright-report' \
          \) -prune -exec rm -rf {} +

          rm -f EmployeeApi1.zip
          zip -qr EmployeeApi1.zip EmployeeApi1

          # Refuse the archive if local-only configuration or generated output slipped in.
          python - <<'PY'
          import sys
          import zipfile

          forbidden_names = {
              "appsettings.Development.json",
              "compose.yaml.old",
          }
          forbidden_dirs = {
              ".git", ".vscode", ".claude", "node_modules", "bin", "obj",
              "TestResults", "test-results", "playwright-report",
          }

          with zipfile.ZipFile("EmployeeApi1.zip") as archive:
              bad = []
              for raw_name in archive.namelist():
                  parts = raw_name.strip("/").split("/")
                  basename = parts[-1]
                  if basename == ".env":
                      bad.append(raw_name)
                  elif basename.startswith(".env.") and basename != ".env.example":
                      bad.append(raw_name)
                  elif basename in forbidden_names or basename.endswith(".pfx") or basename.endswith(".key"):
                      bad.append(raw_name)
                  elif any(part in forbidden_dirs for part in parts):
                      bad.append(raw_name)

          if bad:
              print("Unsafe local configuration or generated output found:")
              print("\n".join(bad))
              sys.exit(1)
          print("Archive safety check passed.")
          PY

      - name: Commit archive if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EmployeeApi1.zip
          if git diff --cached --quiet; then
            echo "EmployeeApi1.zip is already up to date."
            exit 0
          fi
          git commit -m "Add sanitized EmployeeApi1.zip"
          git push
