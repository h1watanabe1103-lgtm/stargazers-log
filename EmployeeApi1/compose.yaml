services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in EmployeeApi1/.env}
    ports:
      - "1433:1433"          # dotnet run（ホスト側）からもつなげるように公開
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in EmployeeApi1/.env}
      Jwt__Issuer: EmployeeApi
      Jwt__Audience: EmployeeApiClients
      Auth__SeedAdmin__UserName: ${SEED_ADMIN_USERNAME:?Set SEED_ADMIN_USERNAME in EmployeeApi1/.env}
      Auth__SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in EmployeeApi1/.env}
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=EmployeeDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
