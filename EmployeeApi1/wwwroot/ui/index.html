<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社員スキル管理 仮UI</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-text: #ffffff; --danger: #dc2626; --ok: #15803d; --warn: #b45309;
    --chip: #eef2ff; --chip-text: #3730a3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827; --card: #1f2937; --text: #f3f4f6; --muted: #9ca3af; --line: #374151;
      --accent: #60a5fa; --accent-text: #0b1220; --danger: #f87171; --ok: #4ade80; --warn: #fbbf24;
      --chip: #312e81; --chip-text: #e0e7ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
           padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
           background: var(--chip); color: var(--chip-text); }
  .badge.dev { background: #fef3c7; color: #92400e; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
  input[type=text], input[type=password] { width: 100%; padding: 8px 10px; border: 1px solid var(--line);
         border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  .row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
           color: var(--text); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button.small { padding: 2px 10px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  .chip { display: inline-block; margin: 0 4px 4px 0; padding: 0 8px; border-radius: 999px; font-size: 13px;
          background: var(--chip); color: var(--chip-text); }
  .muted { color: var(--muted); font-size: 13px; }
  #message { position: sticky; top: 0; z-index: 5; margin: 0; padding: 10px 14px; border-radius: 8px;
             border: 1px solid var(--line); background: var(--card); white-space: pre-wrap; display: none; }
  #message.ok { border-color: var(--ok); }
  #message.error { border-color: var(--danger); }
  #message.warn { border-color: var(--warn); }
  .hidden { display: none !important; }
  details summary { cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>社員スキル管理 <span class="badge dev">仮UI（開発用）</span></h1>
  <div class="actions">
    <span id="who" class="muted">未ログイン</span>
    <button id="logoutBtn" class="small hidden">ログアウト</button>
  </div>
</header>

<main>
  <p id="message" role="status"></p>

  <!-- ログイン -->
  <section id="loginSection">
    <h2>ログイン</h2>
    <form id="loginForm">
      <div class="row">
        <div><label for="loginUser">ユーザー名</label><input id="loginUser" type="text" autocomplete="username" required></div>
        <div><label for="loginPass">パスワード</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
      </div>
      <div class="actions">
        <button class="primary" type="submit">ログイン</button>
        <button type="button" id="fillAdmin">admin を入力</button>
        <button type="button" id="fillUser">user を入力</button>
      </div>
      <p class="muted">「入力」ボタンは、開発用の初期ユーザー（ダミー）を、入力欄に入れるだけです。</p>
    </form>
    <details style="margin-top:12px">
      <summary>ユーザーを新規登録する（一般ユーザーになります）</summary>
      <form id="registerForm" style="margin-top:12px">
        <div class="row">
          <div><label for="regUser">ユーザー名（半角英数字と _ . - 、3〜50文字）</label><input id="regUser" type="text" required></div>
          <div><label for="regPass">パスワード（8文字以上）</label><input id="regPass" type="password" autocomplete="new-password" required></div>
        </div>
        <button type="submit">登録する</button>
      </form>
    </details>
  </section>

  <!-- 社員 -->
  <section id="employeesSection" class="hidden">
    <h2>社員</h2>
    <form id="searchForm" class="actions" style="margin-bottom:12px">
      <input id="keyword" type="text" placeholder="氏名・所属・スキルで検索" style="max-width:320px">
      <button type="submit">検索</button>
      <button type="button" id="reloadBtn">一覧を再取得</button>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>氏名</th><th>所属</th><th>スキル</th><th class="adminOnly"></th></tr></thead>
        <tbody id="employeeRows"></tbody>
      </table>
    </div>
    <p id="emptyNote" class="muted hidden">該当する社員はいません。</p>
  </section>

  <!-- 登録・更新（管理者のみ） -->
  <section id="formSection" class="hidden">
    <h2 id="formTitle">社員を登録する（管理者のみ）</h2>
    <form id="employeeForm">
      <div class="row">
        <div><label for="empName">氏名</label><input id="empName" type="text"></div>
        <div><label for="empDept">所属</label><input id="empDept" type="text"></div>
        <div><label for="empSkills">スキル（、または , で区切る）</label><input id="empSkills" type="text" placeholder="C#, SQL"></div>
      </div>
      <div class="actions">
        <button class="primary" type="submit" id="saveBtn">登録する</button>
        <button type="button" id="cancelEditBtn" class="hidden">編集をやめる</button>
      </div>
      <p class="muted">一般ユーザーで送ると、403（権限がない）になります。権限の確認にも使えます。</p>
    </form>
  </section>

  <!-- パスワード変更 -->
  <section id="passwordSection" class="hidden">
    <h2>パスワードを変更する（自分）</h2>
    <form id="passwordForm">
      <div class="row">
        <div><label for="curPass">現在のパスワード</label><input id="curPass" type="password" autocomplete="current-password" required></div>
        <div><label for="newPass">新しいパスワード（8文字以上）</label><input id="newPass" type="password" autocomplete="new-password" required></div>
      </div>
      <button type="submit">変更する</button>
    </form>
  </section>

  <!-- ユーザー管理（管理者のみ） -->
  <section id="usersSection" class="hidden">
    <h2>ユーザー（管理者のみ）</h2>
    <div class="actions" style="margin-bottom:12px"><button id="loadUsersBtn">ユーザーの一覧を取得</button></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>ユーザー名</th><th>権限</th><th>ロック</th><th></th></tr></thead>
        <tbody id="userRows"></tbody>
      </table>
    </div>
    <p class="muted">パスワードの再設定をすると、ロックも解除されます。</p>
  </section>
</main>

<script>
(function () {
  "use strict";

  // ---- 状態 ----
  const state = { token: null, role: null, userName: null, editingId: null };

  // 画面を再読み込みしても、ログインが続くように、タブの間だけ、保存する（失敗しても動く）
  function save() {
    try { sessionStorage.setItem("tmpUi", JSON.stringify({ token: state.token, role: state.role, userName: state.userName })); } catch (e) {}
  }
  function load() {
    try {
      const v = JSON.parse(sessionStorage.getItem("tmpUi") || "null");
      if (v && v.token) { state.token = v.token; state.role = v.role; state.userName = v.userName; }
    } catch (e) {}
  }

  const $ = (id) => document.getElementById(id);

  // ---- 表示の補助 ----
  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    });
    (children || []).forEach((c) => e.append(c));
    return e;
  }

  function show(text, kind) {
    const m = $("message");
    m.textContent = text;
    m.className = kind || "";
    m.style.display = text ? "block" : "none";
  }

  // サーバーのエラー（ProblemDetails）を、読みやすい文にする
  function describe(r, okText) {
    if (r.ok) return okText || ("成功しました（" + r.status + "）");
    const d = r.data;
    const lines = [r.status + " " + ((d && d.title) || "エラーが発生しました。")];
    if (d && d.detail) lines.push(d.detail);
    if (d && d.errors) {
      Object.entries(d.errors).forEach(([k, msgs]) => msgs.forEach((m) => lines.push("・" + m)));
    }
    const retry = r.res.headers.get("Retry-After");
    if (retry) lines.push("（" + retry + "秒後に、もう一度お試しください）");
    return lines.join("\n");
  }

  // ---- API ----
  async function api(method, path, body) {
    const headers = {};
    if (body !== undefined) headers["Content-Type"] = "application/json";
    if (state.token) headers["Authorization"] = "Bearer " + state.token;
    const res = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
    const text = await res.text();
    let data = null;
    if (text) { try { data = JSON.parse(text); } catch (e) { data = text; } }
    const r = { ok: res.ok, status: res.status, data, res };
    // ログイン中に 401 になったら、期限切れとして、ログアウトする
    if (res.status === 401 && state.token && path !== "/auth/login") {
      logout();
      show("ログインの有効期限が切れました。もう一度ログインしてください。\n" + describe(r), "warn");
      r.handled = true;
    }
    return r;
  }

  // ---- ログイン状態の反映 ----
  function render() {
    const loggedIn = !!state.token;
    const admin = state.role === "Admin";
    $("loginSection").classList.toggle("hidden", loggedIn);
    $("employeesSection").classList.toggle("hidden", !loggedIn);
    $("formSection").classList.toggle("hidden", !loggedIn);
    $("passwordSection").classList.toggle("hidden", !loggedIn);
    $("usersSection").classList.toggle("hidden", !admin);
    $("logoutBtn").classList.toggle("hidden", !loggedIn);
    $("who").textContent = loggedIn ? state.userName + "（" + (admin ? "管理者" : "一般") + "）" : "未ログイン";
    document.querySelectorAll(".adminOnly").forEach((n) => n.classList.toggle("hidden", !admin));
  }

  function logout() {
    state.token = null; state.role = null; state.userName = null; state.editingId = null;
    save(); render();
    $("employeeRows").replaceChildren();
    $("userRows").replaceChildren();
    resetForm();
  }

  // ---- 社員の一覧 ----
  function renderEmployees(list) {
    const body = $("employeeRows");
    body.replaceChildren();
    $("emptyNote").classList.toggle("hidden", list.length > 0);
    const admin = state.role === "Admin";
    list.forEach((e) => {
      const skills = el("td", {}, (e.skills || []).map((s) => el("span", { class: "chip" }, [s.name])));
      const tr = el("tr", {}, [
        el("td", {}, [String(e.id)]),
        el("td", {}, [e.name]),
        el("td", {}, [e.department]),
        skills
      ]);
      if (admin) {
        tr.append(el("td", { class: "adminOnly" }, [
          el("button", { class: "small", onclick: () => startEdit(e) }, ["編集"]),
          " ",
          el("button", { class: "small danger", onclick: () => removeEmployee(e) }, ["削除"])
        ]));
      }
      body.append(tr);
    });
  }

  async function loadEmployees() {
    const kw = $("keyword").value.trim();
    const path = kw ? "/employees/search?keyword=" + encodeURIComponent(kw) : "/employees";
    const r = await api("GET", path);
    if (r.handled) return;
    if (!r.ok) { show(describe(r), "error"); return; }
    renderEmployees(r.data);
    show(r.data.length + "件を表示しています。", "ok");
  }

  // ---- 社員の登録・更新・削除 ----
  function readForm() {
    const skills = $("empSkills").value.split(/[,、]/).map((s) => s.trim()).filter((s) => s);
    return { name: $("empName").value, department: $("empDept").value, skills: skills.map((s) => ({ name: s })) };
  }

  function resetForm() {
    state.editingId = null;
    $("employeeForm").reset();
    $("formTitle").textContent = "社員を登録する（管理者のみ）";
    $("saveBtn").textContent = "登録する";
    $("cancelEditBtn").classList.add("hidden");
  }

  function startEdit(e) {
    state.editingId = e.id;
    $("empName").value = e.name;
    $("empDept").value = e.department;
    $("empSkills").value = (e.skills || []).map((s) => s.name).join(", ");
    $("formTitle").textContent = "社員を更新する（ID " + e.id + "）";
    $("saveBtn").textContent = "更新する";
    $("cancelEditBtn").classList.remove("hidden");
    $("formSection").scrollIntoView({ behavior: "smooth" });
  }

  async function removeEmployee(e) {
    if (!confirm(e.name + " さんを削除します。よろしいですか？")) return;
    const r = await api("DELETE", "/employees/" + e.id);
    if (r.handled) return;
    show(describe(r, "削除しました（204）"), r.ok ? "ok" : "error");
    if (r.ok) loadEmployees();
  }

  // ---- ユーザー（管理者） ----
  function renderUsers(list) {
    const body = $("userRows");
    body.replaceChildren();
    list.forEach((u) => {
      const locked = u.lockedUntil ? new Date(u.lockedUntil).toLocaleString("ja-JP") + " まで" : "—";
      body.append(el("tr", {}, [
        el("td", {}, [String(u.id)]),
        el("td", {}, [u.userName]),
        el("td", {}, [u.role]),
        el("td", {}, [locked]),
        el("td", {}, [el("button", { class: "small", onclick: () => resetPassword(u) }, ["パスワードを再設定"])])
      ]));
    });
  }

  async function loadUsers() {
    const r = await api("GET", "/auth/users");
    if (r.handled) return;
    if (!r.ok) { show(describe(r), "error"); return; }
    renderUsers(r.data);
    show(r.data.length + "人のユーザーを表示しています。", "ok");
  }

  async function resetPassword(u) {
    const pw = prompt(u.userName + " の新しいパスワード（8文字以上）を入力してください。");
    if (pw === null) return;
    const r = await api("POST", "/auth/users/" + u.id + "/reset-password", { newPassword: pw });
    if (r.handled) return;
    show(describe(r, u.userName + " のパスワードを再設定しました（204）。ロックも解除されています。"), r.ok ? "ok" : "error");
    if (r.ok) loadUsers();
  }

  // ---- イベント ----
  $("loginForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const r = await api("POST", "/auth/login", { userName: $("loginUser").value, password: $("loginPass").value });
    if (!r.ok) { show(describe(r), r.status === 429 ? "warn" : "error"); return; }
    state.token = r.data.accessToken; state.role = r.data.role; state.userName = $("loginUser").value;
    $("loginPass").value = "";
    save(); render();
    show("ログインしました（" + r.data.role + "）。", "ok");
    loadEmployees();
    if (state.role === "Admin") loadUsers();
  });

  $("fillAdmin").addEventListener("click", () => { $("loginUser").value = "admin"; $("loginPass").value = "Admin_Passw0rd!"; });
  $("fillUser").addEventListener("click", () => { $("loginUser").value = "user"; $("loginPass").value = "User_Passw0rd!"; });

  $("registerForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const r = await api("POST", "/auth/register", { userName: $("regUser").value, password: $("regPass").value });
    show(describe(r, "ユーザーを登録しました（201）。一般ユーザーとしてログインできます。"), r.ok ? "ok" : "error");
    if (r.ok) { $("loginUser").value = $("regUser").value; $("regPass").value = ""; }
  });

  $("logoutBtn").addEventListener("click", () => { logout(); show("ログアウトしました。", "ok"); });

  $("searchForm").addEventListener("submit", (ev) => { ev.preventDefault(); loadEmployees(); });
  $("reloadBtn").addEventListener("click", () => { $("keyword").value = ""; loadEmployees(); });

  $("employeeForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const editing = state.editingId !== null;
    const r = editing
      ? await api("PUT", "/employees/" + state.editingId, readForm())
      : await api("POST", "/employees", readForm());
    if (r.handled) return;
    show(describe(r, editing ? "更新しました（204）" : "登録しました（201）"), r.ok ? "ok" : "error");
    if (r.ok) { resetForm(); loadEmployees(); }
  });
  $("cancelEditBtn").addEventListener("click", resetForm);

  $("passwordForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const r = await api("POST", "/auth/change-password", { currentPassword: $("curPass").value, newPassword: $("newPass").value });
    if (r.handled) return;
    show(describe(r, "パスワードを変更しました（204）。次のログインから、新しいパスワードを使います。"), r.ok ? "ok" : "error");
    if (r.ok) $("passwordForm").reset();
  });

  $("loadUsersBtn").addEventListener("click", loadUsers);

  // ---- 開始 ----
  load();
  render();
  if (state.token) { loadEmployees(); if (state.role === "Admin") loadUsers(); }
})();
</script>
</body>
</html>
