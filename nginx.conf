server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 画面の中のURL（例：/employees）を直接開いたり、再読み込みしても、index.html を返す
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 最低限のセキュリティ用ヘッダー
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
